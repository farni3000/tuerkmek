# Türkmek – A1-Wortliste, erste Runde
#
# id    ASCII-Kennung (Dateiname, Callback-Daten) – muss zu turkmek/icons.py passen
# tr    türkische Schreibweise
# de    deutsche Bedeutung
# pos   Wortart
# example  Beispielsatz türkisch + deutsch

# --- Haushalt -------------------------------------------------------------
- id: kapi
  tr: kapı
  de: die Tür
  pos: noun
  example:
    tr: Kapıyı kapatır mısın?
    de: Machst du die Tür zu?

- id: pencere
  tr: pencere
  de: das Fenster
  pos: noun
  example:
    tr: Pencere açık.
    de: Das Fenster ist offen.

- id: masa
  tr: masa
  de: der Tisch
  pos: noun
  example:
    tr: Kitap masada.
    de: Das Buch ist auf dem Tisch.

- id: sandalye
  tr: sandalye
  de: der Stuhl
  pos: noun
  example:
    tr: Sandalye çok rahat.
    de: Der Stuhl ist sehr bequem.

- id: yatak
  tr: yatak
  de: das Bett
  pos: noun
  example:
    tr: Yatak büyük.
    de: Das Bett ist groß.

- id: kitap
  tr: kitap
